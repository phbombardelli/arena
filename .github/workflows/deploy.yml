# Publica o Arena no GitHub Pages a cada envio para a main.
#
# O programa continua sendo local e offline: o que vai para o Pages é o
# mesmo dist/ que abre por file:// sem servidor nenhum. A hospedagem é só
# uma forma de levar o programa para outra máquina, não uma dependência.
name: Publicar

on:
  push:
    branches: [main]
  # Permite publicar na mão pela aba Actions, sem precisar de um commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; envios novos não cancelam a que está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Os testes barram a publicação: percurso quebrado não vai para o ar.
      - run: npm test
      - run: npx tsc --noEmit

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
